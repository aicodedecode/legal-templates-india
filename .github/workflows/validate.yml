name: Validate templates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt -r mcp-server/requirements.txt
      - run: python3 scripts/validate.py
      - run: python3 scripts/build_catalog.py --check
      - run: python3 mcp-server/smoke_test.py
